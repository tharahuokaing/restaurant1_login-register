<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ហួ កាំង 5 Star - Branch 1 | Authentication</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <main class="auth-wrapper">
    <div class="auth-card">
      
      <!-- Brand Header -->
      <header class="brand-header">
        <div class="brand-badge">BRANCH 1</div>
        <h1 class="brand-title">ហួ កាំង 5 Star</h1>
        <p class="brand-subtitle">ប្រព័ន្ធចូលប្រើប្រាស់ និងចុះឈ្មោះ</p>
      </header>

      <!-- Segment Toggle Switch -->
      <nav class="auth-toggle-group">
        <button id="tab-login" class="toggle-btn active" onclick="switchTab('login')">ចូលប្រព័ន្ធ</button>
        <button id="tab-register" class="toggle-btn" onclick="switchTab('register')">ចុះឈ្មោះ</button>
      </nav>

      <!-- LOGIN FORM -->
      <form id="login-form" class="auth-form active" onsubmit="handleAuth(event, 'login')">
        <div class="form-group">
          <label for="login-user">ឈ្មោះអ្នកប្រើប្រាស់ / អ៊ីមែល</label>
          <input type="text" id="login-user" placeholder="បញ្ចូលឈ្មោះ ឬអ៊ីមែល" required />
        </div>

        <div class="form-group">
          <label for="login-pass">ពាក្យសម្ងាត់</label>
          <input type="password" id="login-pass" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn-auth-submit">ចូលប្រព័ន្ធ</button>
      </form>

      <!-- REGISTER FORM -->
      <form id="register-form" class="auth-form" onsubmit="handleAuth(event, 'register')">
        <div class="form-group">
          <label for="reg-name">ឈ្មោះពេញ</label>
          <input type="text" id="reg-name" placeholder="បញ្ចូលឈ្មោះពេញ" required />
        </div>

        <div class="form-group">
          <label for="reg-phone">លេខទូរស័ព្ទ</label>
          <input type="tel" id="reg-phone" placeholder="012 345 678" required />
        </div>

        <div class="form-group">
          <label for="reg-pass">ពាក្យសម្ងាត់</label>
          <input type="password" id="reg-pass" placeholder="••••••••" required />
        </div>

        <div class="form-group">
          <label for="reg-confirm-pass">បញ្ជាក់ពាក្យសម្ងាត់</label>
          <input type="password" id="reg-confirm-pass" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn-auth-submit">បង្កើតគណនី</button>
      </form>

      <div id="auth-alert" class="auth-alert"></div>

    </div>
  </main>

  <script src="script.js"></script>
  <script src="ultra_secure_mode.js"></script>
</body>
</html>
