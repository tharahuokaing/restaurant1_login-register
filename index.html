<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ហួ កាំង 5 Star - Branch 1 Cyber POS</title>
  
  <!-- Khmer Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top Header Bar -->
  <header class="top-bar">
    <div class="brand-title">
      <h1>ហួ កាំង <span>5 STAR</span></h1>
      <span class="branch-tag">សាខាទី ១ (BRANCH 1)</span>
    </div>

    <input type="text" id="search-input" placeholder="ស្វែងរកមុខម្ហូប..." />

    <div class="hud-action-group">
      <button class="btn-auth-open" id="open-login-btn">
        <span class="icon">🔑</span> ចូលប្រព័ន្ធ (Login)
      </button>
      <button class="btn-auth-open" id="open-register-btn">
        <span class="icon">📝</span> ចុះឈ្មោះ (Register)
      </button>
    </div>
  </header>

  <!-- Category Scroll Bar -->
  <nav id="category-bar">
    <button class="btn-cat active">ទាំងអស់</button>
    <button class="btn-cat">ម្ហូបពិសេស</button>
    <button class="btn-cat">ភេសជ្ជៈ</button>
    <button class="btn-cat">បង្អែម</button>
  </nav>

  <!-- Main Content Area -->
  <main id="main-content">
    <div id="menu">
      <!-- Item Cards -->
      <div class="product-card">
        <img src="https://via.placeholder.com/64" alt="Item 1" id="product-img-1" />
        <div class="product-title">បាយឆាសាច់គោ 5 Star</div>
        <div class="product-price">$4.50</div>
      </div>

      <div class="product-card">
        <img src="https://via.placeholder.com/64" alt="Item 2" id="product-img-2" />
        <div class="product-title">កាហ្វេទឹកដោះគោទឹកកក</div>
        <div class="product-price">$2.00</div>
      </div>

      <div class="product-card">
        <img src="https://via.placeholder.com/64" alt="Item 3" id="product-img-3" />
        <div class="product-title">ស៊ុបពិសេស ហួ កាំង</div>
        <div class="product-price">$6.80</div>
      </div>
    </div>
  </main>

  <!-- Authentication Modal (Login & Register Forms) -->
  <div class="modal" id="auth-modal">
    <div class="modal-content">
      <!-- Login View -->
      <div id="login-view">
        <h2>ចូលប្រព័ន្ធ (LOGIN)</h2>
        <p class="auth-subtitle">សាខាទី ១ - ហួ កាំង 5 Star System</p>
        
        <form class="auth-form" id="login-form">
          <div class="input-group">
            <label for="login-username">ឈ្មោះអ្នកប្រើប្រាស់ / អ៊ីមែល</label>
            <input type="text" id="login-username" required placeholder="Username or Email" />
          </div>
          <div class="input-group">
            <label for="login-password">លេខសំងាត់</label>
            <input type="password" id="login-password" required placeholder="••••••••" />
          </div>
          <button type="submit" class="btn-confirm">ចូលប្រព័ន្ធ</button>
        </form>

        <p class="auth-toggle">
          មិនទាន់មានគណនី? <a href="#" id="switch-to-register">ចុះឈ្មោះនៅទីនេះ</a>
        </p>
      </div>

      <!-- Register View -->
      <div id="register-view" style="display: none;">
        <h2>ចុះឈ្មោះ (REGISTER)</h2>
        <p class="auth-subtitle">បង្កើតគណនីថ្មីសម្រាប់ សាខាទី ១</p>
        
        <form class="auth-form" id="register-form">
          <div class="input-group">
            <label for="reg-fullname">ឈ្មោះពេញ</label>
            <input type="text" id="reg-fullname" required placeholder="Full Name" />
          </div>
          <div class="input-group">
            <label for="reg-username">ឈ្មោះអ្នកប្រើប្រាស់</label>
            <input type="text" id="reg-username" required placeholder="Username" />
          </div>
          <div class="input-group">
            <label for="reg-password">លេខសំងាត់</label>
            <input type="password" id="reg-password" required placeholder="••••••••" />
          </div>
          <button type="submit" class="btn-confirm">បង្កើតគណនី</button>
        </form>

        <p class="auth-toggle">
          មានគណនីរួចហើយ? <a href="#" id="switch-to-login">ចូលប្រព័ន្ធនៅទីនេះ</a>
        </p>
      </div>

      <div class="modal-footer">
        <button class="btn-cancel" id="close-auth-modal">បិទ (Close)</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="ultra_secure_mode.js"></script>
</body>
</html>
